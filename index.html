<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --font-main: 'Montserrat', sans-serif;
      --bg-glass: rgba(255, 255, 255, 0.85);
      --border-glass: rgba(255, 255, 255, 0.5);
      --z: 2147483000;
    }

    body {
      margin: 0;
      font-family: var(--font-main);
      background: transparent;
      box-sizing: border-box;
    }

    * { box-sizing: inherit; }
    .pe-hidden { display: none !important; }

    /* ===== Center CTA (Kelluva nappi) ===== */
    .pe-ctaCenter {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: var(--z);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      padding: 10px 20px 10px 10px;
      border-radius: 50px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: var(--bg-glass);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      cursor: pointer;
      user-select: none;
      max-width: calc(100vw - 40px);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .pe-ctaCenter:active { transform: translate(-50%, -50%) scale(0.97); }

    .pe-iconWrap {
      width: 44px; height: 44px;
      flex: 0 0 44px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: #000000;
      color: #ffffff;
      font-size: 20px;
    }

    .pe-ctaText { display: flex; flex-direction: column; line-height: 1.2; text-align: left; }
    .pe-ctaTitle { font-weight: 600; font-size: 14px; color: #000; }
    .pe-ctaSub { font-weight: 400; font-size: 12px; color: #666; margin-top: 2px; }

    /* ===== Popup Overlay (Lasimainen tausta) ===== */
    .pe-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: calc(var(--z) + 1);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0; visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .pe-overlay[data-open="true"] { opacity: 1; visibility: visible; }

    /* ===== Panel ===== */
    .pe-panel {
      position: relative;
      width: 90%;
      max-width: 450px;
      background: var(--bg-glass);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .pe-close {
      position: absolute;
      top: 15px; right: 15px;
      font-size: 24px; font-weight: 600;
      color: #000;
      background: rgba(255, 255, 255, 0.9);
      width: 35px; height: 35px;
      border-radius: 50%;
      border: none;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .pe-header {
      padding: 30px 30px 10px;
      text-align: center;
    }
    .pe-header h3 { margin: 0; font-weight: 600; font-size: 20px; color: #000; }
    .pe-header p { margin: 8px 0 0 0; font-size: 13px; color: #444; line-height: 1.5; }

    .pe-body {
      padding: 15px 30px 30px;
      overflow-y: auto;
      display: flex; flex-direction: column; gap: 15px;
    }

    /* Input & Textarea */
    .pe-input, .pe-textarea {
      width: 100%;
      padding: 14px 20px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.6);
      font-family: var(--font-main);
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }
    .pe-input:focus, .pe-textarea:focus { border-color: rgba(0, 0, 0, 0.4); }
    .pe-textarea { min-height: 100px; resize: vertical; border-radius: 16px; }

    /* File Input */
    .pe-file-wrapper {
      position: relative;
      border: 1px dashed rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.5);
      padding: 15px; text-align: center;
      cursor: pointer; transition: 0.3s;
    }
    .pe-file-wrapper:hover { background: rgba(255, 255, 255, 0.8); }
    .pe-file-wrapper span { font-size: 13px; color: #333; font-weight: 500; }
    .pe-file {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    /* Previews */
    .pe-previews { display: none; gap: 10px; flex-wrap: wrap; margin-top: -5px; }
    .pe-previews[data-show="true"] { display: flex; }
    .pe-thumb {
      width: 60px; height: 60px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .pe-thumb img { width: 100%; height: 100%; object-fit: cover; }

    /* Buttons */
    .pe-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 50px;
      background: #000000;
      color: #ffffff;
      font-family: var(--font-main);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, background 0.3s;
    }
    .pe-btn:active { transform: scale(0.98); }
    .pe-btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Success Card */
    .pe-successCard {
      display: none;
      text-align: center;
      padding: 30px;
    }
    .pe-successCard h4 { font-size: 18px; margin: 0 0 10px 0; color: #000; }
    .pe-successCard p { font-size: 14px; color: #444; line-height: 1.5; margin: 0; }
    .pe-successCard .pe-iconWrap { margin: 0 auto 15px auto; background: #059669; }

  </style>
</head>
<body>

  <button class="pe-ctaCenter" id="peCta" type="button">
    <span class="pe-iconWrap">💭</span>
    <span class="pe-ctaText">
      <span class="pe-ctaTitle">Tatuoinnin Hinta-arvio</span>
      <span class="pe-ctaSub">Pyydä ilmainen arvio</span>
    </span>
  </button>

  <div class="pe-overlay" id="peOverlay" data-open="false">
    <div class="pe-panel">
      <button class="pe-close" id="peClose">&times;</button>
      
      <div id="formContainer">
        <div class="pe-header">
          <h3>Pyydä Hinta-arvio</h3>
          <p>Kerro ideastasi, toivotusta koosta ja sijainnista. Voit ladata myös referenssikuvia.</p>
        </div>

        <form class="pe-body" id="peForm">
          <input type="email" id="peEmail" class="pe-input" placeholder="Sähköpostiosoite *" required />
          <textarea id="peText" class="pe-textarea" placeholder="Kuvaile tatuointia (esim. koko, sijainti, tyyli)... *" required></textarea>
          
          <div class="pe-file-wrapper">
            <span>+ Lisää referenssikuvia (Vapaaehtoinen)</span>
            <input class="pe-file" id="peImages" type="file" accept="image/*" multiple />
          </div>
          <div class="pe-previews" id="pePreviews"></div>

          <button type="submit" class="pe-btn" id="peSubmit">Lähetä Pyyntö</button>
        </form>
      </div>

      <div class="pe-successCard" id="successContainer">
        <div class="pe-iconWrap">✓</div>
        <h4>Pyyntö Lähetetty!</h4>
        <p>Kiitos viestistäsi. Saat meiltä pian sähköpostia, jossa on tatuointisi hinta-arvio!</p>
        <button class="pe-btn" style="margin-top: 25px;" id="peCloseSuccess">Sulje</button>
      </div>
    </div>
  </div>

  <script>
    // YENİ URL EKLENDİ
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwEu21LcWyiV5oYlv3Lua25c_N-rRfaRbrCCNLyDi7eWMB6VquzJlHMYsaVDyDU0EmOQ/exec";

    const MAX_IMAGES = 5;
    const MAX_DIM = 1200;
    const JPEG_QUALITY = 0.70;

    const cta = document.getElementById("peCta");
    const overlay = document.getElementById("peOverlay");
    const closeBtn = document.getElementById("peClose");
    const closeSuccessBtn = document.getElementById("peCloseSuccess");
    
    const form = document.getElementById("peForm");
    const emailEl = document.getElementById("peEmail");
    const textEl = document.getElementById("peText");
    const imgEl = document.getElementById("peImages");
    const previewsEl = document.getElementById("pePreviews");
    const submitBtn = document.getElementById("peSubmit");
    
    const formContainer = document.getElementById("formContainer");
    const successContainer = document.getElementById("successContainer");

    cta.addEventListener("click", () => {
      overlay.dataset.open = "true";
      cta.classList.add("pe-hidden");
    });

    function closePanel() {
      overlay.dataset.open = "false";
      cta.classList.remove("pe-hidden");
      setTimeout(() => {
        formContainer.style.display = "block";
        successContainer.style.display = "none";
        form.reset();
        previewsEl.innerHTML = "";
        previewsEl.dataset.show = "false";
      }, 400);
    }
    
    closeBtn.addEventListener("click", closePanel);
    closeSuccessBtn.addEventListener("click", closePanel);

    function fileToImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Image decode error"));
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function compressImage(file) {
      const img = await fileToImage(file);
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > MAX_DIM) {
        const scale = MAX_DIM / Math.max(w, h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);
      return canvas.toDataURL("image/jpeg", JPEG_QUALITY);
    }

    async function processFiles(fileList) {
      const files = Array.from(fileList).slice(0, MAX_IMAGES);
      const results = [];
      previewsEl.innerHTML = "";
      
      if (files.length > 0) {
        previewsEl.dataset.show = "true";
      } else {
        previewsEl.dataset.show = "false";
      }

      for (const f of files) {
        if (!f.type.startsWith("image/")) continue;
        const dataUrl = await compressImage(f);
        
        const wrap = document.createElement("div");
        wrap.className = "pe-thumb";
        wrap.innerHTML = `<img src="${dataUrl}">`;
        previewsEl.appendChild(wrap);

        results.push({
          name: f.name.replace(/\.[^.]+$/, ".jpg"),
          mime: "image/jpeg",
          dataUrl: dataUrl
        });
      }
      return results;
    }

    imgEl.addEventListener("change", async () => {
      if (imgEl.files.length > MAX_IMAGES) {
        alert("Voit ladata enintään " + MAX_IMAGES + " kuvaa.");
      }
      previewsEl.innerHTML = "<div style='font-size:12px;'>Ladataan esikatseluita...</div>";
      previewsEl.dataset.show = "true";
      
      const files = Array.from(imgEl.files).slice(0, MAX_IMAGES);
      previewsEl.innerHTML = "";
      for (const f of files) {
        if (!f.type.startsWith("image/")) continue;
        const reader = new FileReader();
        reader.onload = (e) => {
          const wrap = document.createElement("div");
          wrap.className = "pe-thumb";
          wrap.innerHTML = `<img src="${e.target.result}">`;
          previewsEl.appendChild(wrap);
        };
        reader.readAsDataURL(f);
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const emailVal = emailEl.value.trim();
      const textVal = textEl.value.trim();
      
      if(!emailVal || !textVal) {
        alert("Täytä sähköposti ja kuvaus.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Lähetetään...";

      try {
        const processedImages = await processFiles(imgEl.files);
        
        // mode: "no-cors" sayesinde Google'ın güvenlik engelleri aşılır
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors", 
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            email: emailVal,
            text: textVal,
            images: processedImages
          })
        });

        // "no-cors" kullanıldığı için kod buraya düşerse gönderim başarılı varsayılır
        formContainer.style.display = "none";
        successContainer.style.display = "block";
        
      } catch (err) {
        console.error(err);
        alert("Yhteysvirhe. Yritä uudelleen myöhemmin.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Lähetä Pyyntö";
      }
    });
  </script>
</body>
</html>
